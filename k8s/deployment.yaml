apiVersion: apps/v1
kind: Deployment
metadata:
  name: homemade-app
  labels:
    app: homemade
spec:
  replicas: 2
  selector:
    matchLabels:
      app: homemade
  template:
    metadata:
      labels:
        app: homemade
    spec:
      containers:
        - name: homemade
          image: homemade:latest
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: homemade-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: homemade-service
spec:
  selector:
    app: homemade
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homemade-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - homemadeeverything.com
      secretName: homemade-tls
  rules:
    - host: homemadeeverything.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homemade-service
                port:
                  number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: homemade-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: homemade-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
